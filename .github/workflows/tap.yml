name: Update Homebrew tap

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to sync
        required: true
        type: string
      formula_kind:
        description: Formula to update
        required: true
        default: nightly
        type: choice
        options: [nightly, release]
  release:
    types: [published]
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to sync
        required: true
        type: string
      formula_kind:
        description: Formula to update
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: mpv-tap-update
  cancel-in-progress: true

jobs:
  update:
    if: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Update tap formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          FORMULA_KIND: ${{ inputs.formula_kind || 'release' }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping tap update."
            exit 0
          fi
          bash .github/scripts/update-tap.sh
