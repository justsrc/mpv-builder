name: Build mpv (master)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mpv-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install \
            aom \
            autoconf \
            automake \
            dav1d \
            fdk-aac \
            fontconfig \
            freetype \
            fribidi \
            glslang \
            gmp \
            gnutls \
            harfbuzz \
            jpeg-xl \
            lame \
            libarchive \
            libass \
            libbluray \
            libvmaf \
            libgme \
            libmodplug \
            libogg \
            opus \
            libplacebo \
            librsvg \
            libsoxr \
            samba \
            libssh \
            libtool \
            libvorbis \
            libvpx \
            webp \
            libxml2 \
            libzip \
            zimg \
            meson \
            molten-vk \
            ninja \
            openssl@3 \
            pkg-config \
            rav1e \
            shaderc \
            snappy \
            svt-av1 \
            vulkan-loader \
            x264 \
            x265 \
            xxhash \
            libvidstab \
            libcdio

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-cargo-c-v1

      - name: Install cargo-c
        run: |
          if ! cargo cinstall --help >/dev/null 2>&1; then
              cargo install cargo-c --locked
          fi

      - name: Build and install libdovi
        run: |
          git clone --depth=1 https://github.com/quietvoid/dovi_tool.git
          cd dovi_tool/dolby_vision
          cargo cinstall --release --prefix /opt/homebrew

      - name: Clone mpv-build
        run: |
          git clone --depth=1 https://github.com/mpv-player/mpv-build.git

      - name: Copy custom options
        run: |
          cp ffmpeg_options mpv-build/
          cp mpv_options mpv-build/

      - name: Build mpv
        working-directory: mpv-build
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig
        run: |
          ./use-mpv-master
          ./rebuild

          python3 TOOLS/osxbundle.py build/mpv

      - name: Locate app bundle
        working-directory: mpv-build
        run: |
          find . -name "*.app"

      - name: Dump configure logs on failure
        if: failure()
        run: |
          echo "===== Searching for vidstab ====="
          grep -R -n -A20 -B20 "vidstab" mpv-build 2>/dev/null || true

          echo
          echo "===== FFmpeg config.log ====="
          find mpv-build -path "*/ffbuild/config.log" -exec sh -c '
            echo "---- {} ----"
            grep -n -A20 -B20 "vidstab" "{}" || cat "{}"
          ' \;
