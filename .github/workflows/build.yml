name: Build & release mpv

on:
  push:
    branches: [main]
    paths:
      - ffmpeg_options
      - mpv_options
      - osxbundle.py
      - dylib_unhell.py
      - .github/scripts/**
      - .github/workflows/build.yml
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag; leave blank to update the nightly release
        required: false
        type: string
      release_title:
        description: Optional versioned-release title
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Version tag; leave blank to update the nightly release
        required: false
        type: string
      release_title:
        description: Optional versioned-release title
        required: false
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false

permissions:
  actions: write
  contents: write

concurrency:
  group: mpv-build
  cancel-in-progress: true

jobs:
  upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      mpv_sha: ${{ steps.check.outputs.mpv_sha }}
      mpv_build_sha: ${{ steps.check.outputs.mpv_build_sha }}
      previous_mpv_sha: ${{ steps.check.outputs.previous_mpv_sha }}
      previous_mpv_build_sha: ${{ steps.check.outputs.previous_mpv_build_sha }}
      nightly_title: ${{ steps.check.outputs.nightly_title }}
      build_stamp: ${{ steps.check.outputs.build_stamp }}

    steps:
      - uses: actions/checkout@v7

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-upstream.sh

  build-and-release:
    needs: upstream
    if: ${{ github.event_name != 'schedule' || needs.upstream.outputs.should_build == 'true' }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set release metadata
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_RELEASE_TITLE: ${{ inputs.release_title }}
          NIGHTLY_TITLE: ${{ needs.upstream.outputs.nightly_title }}
        run: |
          if [[ -n "$INPUT_RELEASE_TAG" ]]; then
            tag="$INPUT_RELEASE_TAG"
            title="${INPUT_RELEASE_TITLE:-$tag}"
            kind=release
            prerelease=false
          else
            tag=nightly
            title="$NIGHTLY_TITLE"
            kind=nightly
            prerelease=true
          fi

          {
            printf 'tag=%s\n' "$tag"
            printf 'title=%s\n' "$title"
            printf 'kind=%s\n' "$kind"
            printf 'prerelease=%s\n' "$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo and libdovi build state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.cache/mpv-builder
          key: ${{ runner.os }}-libdovi-v1-${{ hashFiles('.github/scripts/build-libdovi.sh') }}

      - name: Install dependencies
        run: bash .github/scripts/install-packages.sh

      - name: Build and install libdovi
        run: bash .github/scripts/build-libdovi.sh

      - name: Build and bundle mpv
        id: build
        env:
          RELEASE_NAME: ${{ steps.release.outputs.tag }}
        run: bash .github/scripts/build-mpv.sh

      - name: Generate release notes
        id: notes
        env:
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          MPV_SHA: ${{ needs.upstream.outputs.mpv_sha }}
          MPV_BUILD_SHA: ${{ needs.upstream.outputs.mpv_build_sha }}
          PREVIOUS_MPV_SHA: ${{ needs.upstream.outputs.previous_mpv_sha }}
          PREVIOUS_MPV_BUILD_SHA: ${{ needs.upstream.outputs.previous_mpv_build_sha }}
          BUILD_STAMP: ${{ needs.upstream.outputs.build_stamp }}
        run: bash .github/scripts/release-notes.sh "$RUNNER_TEMP/release-notes.md"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_NOTES_FILE: ${{ steps.notes.outputs.release_notes_path }}
          RELEASE_ASSET_ZIP: ${{ steps.build.outputs.zip_path }}
          RELEASE_ASSET_SHA256: ${{ steps.build.outputs.sha256_path }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: bash .github/scripts/create-release.sh

      - name: Update Homebrew tap formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          FORMULA_KIND: ${{ steps.release.outputs.kind }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping tap update."
            exit 0
          fi
          bash .github/scripts/update-tap.sh

      - name: Upload mpv.app
        uses: actions/upload-artifact@v4
        with:
          name: mpv.app
          path: ${{ steps.build.outputs.app_path }}

      - name: Dump configure logs on failure
        if: failure()
        run: find mpv-build -name '*.log' -type f -print -exec cat {} + || true

      - name: Clean up failed runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Build & release mpv
        run: bash .github/scripts/cleanup-failed-runs.sh
