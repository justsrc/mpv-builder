name: Build mpv (master)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mpv-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install \
            meson \
            pkg-config \
            glslang \
            shaderc \
            vulkan-loader \
            molten-vk \
            xxhash \
            autoconf \
            automake \
            libtool

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-cargo-c-v1

      - name: Install cargo-c
        run: |
          if ! command -v cargo-c >/dev/null; then
            cargo install cargo-c --locked
          fi

      - name: Verify dovi
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
        run: |
          pkg-config --modversion dovi
          pkg-config --cflags --libs dovi

      - name: Clone mpv-build
        run: |
          git clone --depth=1 https://github.com/mpv-player/mpv-build.git

      - name: Copy custom options
        run: |
          cp ffmpeg_options mpv-build/
          cp mpv_options mpv-build/

      - name: Build mpv
        working-directory: mpv-build
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig
        run: |
          ./use-mpv-master
          ./rebuild

          python3 TOOLS/osxbundle.py build/mpv

      - name: Locate app bundle
        working-directory: mpv-build
        run: |
          find . -name "*.app"

      - name: Dump configure logs on failure
        if: failure()
        run: |
          find mpv-build -name "*.log" -exec cat {} \;
