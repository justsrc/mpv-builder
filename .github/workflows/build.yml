name: Build mpv (master)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mpv-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install \
            meson \
            ninja \
            pkg-config \
            glslang \
            shaderc \
            vulkan-loader \
            molten-vk \
            xxhash \
            autoconf \
            automake \
            libtool

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-c
        run: |
          cargo install cargo-c --locked

      - name: Build and install libdovi
        run: |
          git clone --depth=1 https://github.com/quietvoid/dovi_tool.git
          cd dovi_tool/dolby_vision
          cargo cinstall --release --prefix /opt/homebrew

      - name: Verify libdovi
        run: |
          pkg-config --modversion libdovi
          pkg-config --cflags --libs libdovi

      - name: Clone mpv-build
        run: |
          git clone --depth=1 https://github.com/mpv-player/mpv-build.git

      - name: Copy custom options
        run: |
          cp ffmpeg_options mpv-build/
          cp mpv_options mpv-build/

      - name: Build mpv
        working-directory: mpv-build
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig
        run: |
          ./use-mpv-master
          ./rebuild

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mpv-build
          path: mpv-build/build/**

      - name: Dump configure logs on failure
        if: failure()
        run: |
          find mpv-build -name "*.log" -exec cat {} \;
