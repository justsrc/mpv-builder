name: Build & Bundle mpv (master)

on:
  push:
    branches: [main]
    paths:
      - "ffmpeg_options"
      - "mpv_options"
      - "osxbundle.py"
      - ".github/workflows/make.yml"
  workflow_dispatch:

concurrency:
  group: mpv-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install \
            aom \
            autoconf \
            libarchive \
            automake \
            dav1d \
            fdk-aac \
            fontconfig \
            mujs \
            freetype \
            fribidi \
            glslang \
            gmp \
            gnutls \
            harfbuzz \
            jpeg-xl \
            lame \
            libass \
            libbluray \
            libvmaf \
            libgme \
            libmodplug \
            libogg \
            opus \
            libplacebo \
            librsvg \
            libsoxr \
            samba \
            libssh \
            libtool \
            libvorbis \
            libvpx \
            webp \
            libxml2 \
            libzip \
            zimg \
            meson \
            molten-vk \
            ninja \
            openssl@3 \
            pkg-config \
            rav1e \
            shaderc \
            snappy \
            svt-av1 \
            vulkan-loader \
            x264 \
            x265 \
            xxhash \
            libvidstab \
            libcdio \
            libcdio-paranoia \
            libdvdnav \
            luajit \
            rubberband \
            docutils \
            lcms2 \
            uchardet \
            vapoursynth \
            libdvdread \
            icu4c@78

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-cargo-c-v1

      - name: Install cargo-c
        run: |
          if ! cargo cinstall --help >/dev/null 2>&1; then
            cargo install cargo-c --locked
          fi

      - name: Build and install libdovi
        run: |
          git clone --depth=1 https://github.com/quietvoid/dovi_tool.git
          cd dovi_tool/dolby_vision
          cargo cinstall --release --prefix /opt/homebrew

      - name: Clone mpv-build
        run: |
          git clone --depth=1 https://github.com/mpv-player/mpv-build.git

      - name: Copy custom options
        run: |
          cp ffmpeg_options mpv-build/
          cp mpv_options mpv-build/

      - name: Build mpv
        working-directory: mpv-build
        env:
          CFLAGS: -I/opt/homebrew/include
          LDFLAGS: -L/opt/homebrew/lib
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig:/opt/homebrew/opt/glslang/lib/pkgconfig:/opt/homebrew/opt/libarchive/lib/pkgconfig
        run: |
          ./use-mpv-master
          ./rebuild

      - name: Upload build tree
        uses: actions/upload-artifact@v4
        with:
          name: mpv-build-tree
          path: mpv-build
          retention-days: 30

      - name: Dump configure logs on failure
        if: failure()
        run: |
          find mpv-build -name "*.log" -exec cat {} \;

  bundle:
    needs: build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: mpv-build-tree
          path: artifact

      - name: Install runtime libraries
        run: |
          brew update
          brew install \
            aom \
            dav1d \
            fdk-aac \
            fontconfig \
            freetype \
            fribidi \
            gnutls \
            harfbuzz \
            jpeg-xl \
            lame \
            libarchive \
            libass \
            libbluray \
            libcdio \
            libcdio-paranoia \
            libdvdnav \
            libdvdread \
            libgme \
            libmodplug \
            libplacebo \
            libsoxr \
            libssh \
            libvidstab \
            libvmaf \
            libvorbis \
            libvpx \
            opus \
            rav1e \
            rubberband \
            samba \
            snappy \
            svt-av1 \
            uchardet \
            vapoursynth \
            webp \
            x264 \
            x265 \
            zimg

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-c
        run: |
          if ! cargo cinstall --help >/dev/null 2>&1; then
            cargo install cargo-c --locked
          fi

      - name: Build and install libdovi
        run: |
          git clone --depth=1 https://github.com/quietvoid/dovi_tool.git
          cd dovi_tool/dolby_vision
          cargo cinstall --release --prefix /opt/homebrew

      - name: Replace osxbundle.py
        run: |
          cp osxbundle.py artifact/mpv/TOOLS/osxbundle.py

      - name: Bundle mpv.app
        working-directory: artifact/mpv
        run: |
          python3 TOOLS/osxbundle.py build/mpv .

      - name: Upload mpv.app
        uses: actions/upload-artifact@v4
        with:
          name: mpv.app
          path: artifact/mpv/build/mpv.app
