name: Update Homebrew cask

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to sync
        required: true
        type: string
      cask_channel:
        description: Cask channel to update
        required: true
        default: nightly
        type: choice
        options: [nightly, release]

permissions:
  contents: read

concurrency:
  group: mpv-homebrew-update
  cancel-in-progress: false

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline source
        uses: actions/checkout@v7

      - name: Resolve cask release target
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_CASK: ${{ inputs.cask_channel }}
        run: |
          printf 'tag=%s\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"
          printf 'cask=%s\n' "$INPUT_CASK" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew cask
        id: tap
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
        run: |
          python3 scripts/update_formula.py \
            --release-tag "${{ steps.release.outputs.tag }}" \
            --cask "${{ steps.release.outputs.cask }}"

      - name: Write workflow summary
        if: always()
        env:
          TAP_COMMIT_URL: ${{ steps.tap.outputs.tap_commit_url }}
        run: |
          {
            echo '## Homebrew cask update summary'
            [[ -n "${TAP_COMMIT_URL:-}" ]] && echo "- Commit: $TAP_COMMIT_URL" || echo '- No cask change was made.'
          } >> "$GITHUB_STEP_SUMMARY"
