name: Nightly mpv build

on:
  # Run every day at 01:00 IST and allow an on-demand rebuild.
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:
  workflow_call:
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false

permissions:
  actions: write
  contents: write

concurrency:
  # Only one nightly build should run at a time.
  group: mpv-nightly
  cancel-in-progress: true

jobs:
  check-upstream:
    # The upstream check decides whether the nightly build needs to run.
    runs-on: ubuntu-latest

    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      mpv_sha: ${{ steps.check.outputs.mpv_sha }}
      mpv_build_sha: ${{ steps.check.outputs.mpv_build_sha }}
      previous_mpv_sha: ${{ steps.check.outputs.previous_mpv_sha }}
      previous_mpv_build_sha: ${{ steps.check.outputs.previous_mpv_build_sha }}
      nightly_title: ${{ steps.check.outputs.nightly_title }}
      build_stamp: ${{ steps.check.outputs.build_stamp }}

    steps:
      - name: Checkout repository scripts
        uses: actions/checkout@v7

      - name: Check mpv and mpv-build upstream commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-upstream.sh

  build-and-release:
    # The build runs on macOS because the final bundle is produced there.
    needs: check-upstream
    if: github.event_name == 'workflow_dispatch' || needs.check-upstream.outputs.should_build == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v7

      - name: Install Homebrew packages
        run: bash .github/scripts/install-packages.sh

      - name: Build libdovi and install cargo-c
        run: bash .github/scripts/build-libdovi.sh

      - name: Build mpv, bundle the app, and generate checksums
        id: build
        env:
          RELEASE_NAME: nightly
        run: bash .github/scripts/build-mpv.sh

      - name: Generate nightly release notes
        id: notes
        env:
          RELEASE_KIND: nightly
          RELEASE_TITLE: ${{ needs.check-upstream.outputs.nightly_title }}
          RELEASE_TAG: nightly
          MPV_SHA: ${{ needs.check-upstream.outputs.mpv_sha }}
          MPV_BUILD_SHA: ${{ needs.check-upstream.outputs.mpv_build_sha }}
          PREVIOUS_MPV_SHA: ${{ needs.check-upstream.outputs.previous_mpv_sha }}
          PREVIOUS_MPV_BUILD_SHA: ${{ needs.check-upstream.outputs.previous_mpv_build_sha }}
          BUILD_STAMP: ${{ needs.check-upstream.outputs.build_stamp }}
        run: bash .github/scripts/release-notes.sh "$RUNNER_TEMP/nightly-notes.md"

      - name: Create or update the rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: nightly
          RELEASE_TITLE: ${{ needs.check-upstream.outputs.nightly_title }}
          RELEASE_NOTES_FILE: ${{ steps.notes.outputs.release_notes_path }}
          RELEASE_ASSET_ZIP: ${{ steps.build.outputs.zip_path }}
          RELEASE_ASSET_SHA256: ${{ steps.build.outputs.sha256_path }}
          RELEASE_PRERELEASE: true
        run: bash .github/scripts/create-release.sh

      - name: Update the rolling nightly tap formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets['HOMEBREW_TAP_TOKEN'] }}
          RELEASE_TAG: nightly
          TAP_REPO: Justin24506/homebrew-tap
          FORMULA_PATH: Formula/mpv-nightly.rb
          FORMULA_NAME: MpvNightly
          FORMULA_DESC: Rolling nightly build of mpv
        run: bash .github/scripts/update-tap.sh

      - name: Clean up failed nightly runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Nightly mpv build
        run: bash .github/scripts/cleanup-failed-runs.sh
