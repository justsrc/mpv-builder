name: mpv nightly build

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_kind:
        required: false
        type: string
        default: nightly
      version:
        required: false
        type: string
        default: ""
      release_title:
        required: false
        type: string
        default: ""
      release_notes:
        required: false
        type: string
        default: ""
      draft:
        required: false
        type: boolean
        default: false
      prerelease:
        required: false
        type: boolean
        default: false
      update_versioned_cask:
        required: false
        type: boolean
        default: false
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false

permissions:
  contents: write

concurrency:
  group: mpv-build
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      mpv_sha: ${{ steps.check.outputs.mpv_sha }}
      mpv_build_sha: ${{ steps.check.outputs.mpv_build_sha }}
      ffmpeg_sha: ${{ steps.check.outputs.ffmpeg_sha }}
      libass_sha: ${{ steps.check.outputs.libass_sha }}
      libplacebo_sha: ${{ steps.check.outputs.libplacebo_sha }}
      libdovi_sha: ${{ steps.check.outputs.libdovi_sha }}
      cargo_c_sha: ${{ steps.check.outputs.cargo_c_sha }}
      previous_mpv_sha: ${{ steps.check.outputs.previous_mpv_sha }}
      previous_mpv_build_sha: ${{ steps.check.outputs.previous_mpv_build_sha }}
      previous_ffmpeg_sha: ${{ steps.check.outputs.previous_ffmpeg_sha }}
      previous_libass_sha: ${{ steps.check.outputs.previous_libass_sha }}
      previous_libplacebo_sha: ${{ steps.check.outputs.previous_libplacebo_sha }}
      previous_libdovi_sha: ${{ steps.check.outputs.previous_libdovi_sha }}

    steps:
      - name: Check out pipeline source
        uses: actions/checkout@v7

      - name: Resolve upstream revisions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream.py

  build-and-release:
    needs: check-upstream
    if: ${{ github.event_name != 'schedule' || needs.check-upstream.outputs.should_build == 'true' }}
    runs-on: xcode-27
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CFLAGS: -I/opt/homebrew/include
      LDFLAGS: -L/opt/homebrew/lib
      PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/opt/homebrew/share/pkgconfig:/opt/homebrew/opt/glslang/lib/pkgconfig:/opt/homebrew/opt/libarchive/lib/pkgconfig

    steps:
      - name: Check out pipeline source
        uses: actions/checkout@v7

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Resolve release configuration
        id: release
        env:
          INPUT_RELEASE_KIND: ${{ inputs.release_kind }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_TITLE: ${{ inputs.release_title }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_UPDATE_VERSIONED_CASK: ${{ inputs.update_versioned_cask }}
        run: |
          if [[ "${INPUT_RELEASE_KIND:-nightly}" == release ]]; then
            [[ -n "$INPUT_VERSION" ]] || { echo "A version is required." >&2; exit 1; }
            tag="$INPUT_VERSION"
            title="${INPUT_RELEASE_TITLE:-$tag}"
            prerelease="$INPUT_PRERELEASE"
            draft="$INPUT_DRAFT"
            update_cask="$INPUT_UPDATE_VERSIONED_CASK"
            if [[ "$draft" == true ]]; then
              update_cask=false
            fi
            kind=release
          else
            tag=nightly
            title='mpv nightly'
            prerelease=true
            draft=false
            update_cask=true
            kind=nightly
          fi

          {
            printf 'tag=%s\n' "$tag"
            printf 'title=%s\n' "$title"
            printf 'kind=%s\n' "$kind"
            printf 'prerelease=%s\n' "$prerelease"
            printf 'draft=%s\n' "$draft"
            printf 'update_cask=%s\n' "$update_cask"
          } >> "$GITHUB_OUTPUT"

      - name: Record build start
        run: |
          {
            printf 'BUILD_STARTED_AT=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'BUILD_STARTED_EPOCH=%s\n' "$(date +%s)"
            printf 'GITHUB_RUN_URL=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry, Git dependencies, and tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.cargo/.cargo-c-source-sha
          key: ${{ runner.os }}-arm64-cargo-c-v2-${{ needs.check-upstream.outputs.cargo_c_sha }}
          restore-keys: |
            ${{ runner.os }}-arm64-cargo-c-v2-

      - name: Cache libdovi source and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mpv-builder/dovi_tool
            ~/.cache/mpv-builder/libdovi-install
          key: ${{ runner.os }}-arm64-libdovi-build-v2-${{ needs.check-upstream.outputs.libdovi_sha }}

      - name: Prepare Homebrew runner
        run: bash scripts/build_libdovi.sh prepare-homebrew

      - name: Install Homebrew dependencies
        run: bash scripts/build_libdovi.sh brew-dependencies

      - name: Install cargo-c
        env:
          CARGO_C_SHA: ${{ needs.check-upstream.outputs.cargo_c_sha }}
        run: bash scripts/build_libdovi.sh cargo-c

      - name: Build libdovi
        id: libdovi
        env:
          LIBDOVI_SHA: ${{ needs.check-upstream.outputs.libdovi_sha }}
        run: bash scripts/build_libdovi.sh build

      - name: Set build workspace path
        run: printf 'MPV_BUILD_ROOT=%s\n' "$RUNNER_TEMP/mpv-build" >> "$GITHUB_ENV"

      - name: Clone pinned mpv-build source
        env:
          MPV_BUILD_SHA: ${{ needs.check-upstream.outputs.mpv_build_sha }}
        run: |
          rm -rf "$MPV_BUILD_ROOT"
          mkdir -p "$MPV_BUILD_ROOT"
          git -C "$MPV_BUILD_ROOT" init --quiet
          git -C "$MPV_BUILD_ROOT" remote add origin https://github.com/mpv-player/mpv-build.git
          git -C "$MPV_BUILD_ROOT" fetch --depth=1 origin "$MPV_BUILD_SHA"
          git -C "$MPV_BUILD_ROOT" checkout --detach --quiet FETCH_HEAD

      - name: Configure pinned mpv source
        env:
          MPV_SHA: ${{ needs.check-upstream.outputs.mpv_sha }}
          FFMPEG_SHA: ${{ needs.check-upstream.outputs.ffmpeg_sha }}
          LIBASS_SHA: ${{ needs.check-upstream.outputs.libass_sha }}
          LIBPLACEBO_SHA: ${{ needs.check-upstream.outputs.libplacebo_sha }}
        run: |
          cp ffmpeg_options mpv_options "$MPV_BUILD_ROOT/"
          pushd "$MPV_BUILD_ROOT" >/dev/null
          ./use-mpv-master
          ./use-ffmpeg-custom "$FFMPEG_SHA"
          ./use-libass-custom "$LIBASS_SHA"
          ./use-libplacebo-custom "$LIBPLACEBO_SHA"
          ./update --skip-selfupdate
          git -C mpv fetch --depth=1 origin "$MPV_SHA"
          git -C mpv checkout --detach --quiet FETCH_HEAD
          SOURCE_DATE_EPOCH="$(git -C mpv show -s --format=%ct HEAD)"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          popd >/dev/null

      - name: Build mpv from pinned sources
        run: |
          pushd "$MPV_BUILD_ROOT" >/dev/null
          ./clean
          ./build
          popd >/dev/null

      - name: Check dependency resolvability
        if: always()
        run: |
          pkgconfig_dir="$MPV_BUILD_ROOT/build_libs/lib/pkgconfig"
          if [ ! -d "$pkgconfig_dir" ]; then
            echo "No pkg-config files in $pkgconfig_dir, skipping"
            exit 0
          fi
          python3 "$GITHUB_WORKSPACE/scripts/check_link_deps.py" "$pkgconfig_dir" \
            --options "$GITHUB_WORKSPACE/mpv_options"

      - name: Run mpv unit tests
        run: |
          pushd "$MPV_BUILD_ROOT/mpv" >/dev/null
          meson test -C build
          popd >/dev/null

      - name: Print mpv test log
        if: ${{ failure() }}
        run: cat "$MPV_BUILD_ROOT/mpv/build/meson-logs/testlog.txt" || true

      - name: Bundle mpv.app
        id: bundle
        run: |
          pushd "$MPV_BUILD_ROOT" >/dev/null
          mkdir -p mpv/TOOLS
          cp "$GITHUB_WORKSPACE/osxbundle.py" mpv/TOOLS/osxbundle.py
          cp "$GITHUB_WORKSPACE/dylib_unhell.py" mpv/TOOLS/dylib_unhell.py
          pushd mpv >/dev/null
          python3 TOOLS/osxbundle.py build/mpv .
          printf 'bundle_path=%s\n' "$MPV_BUILD_ROOT/mpv/build/mpv.app" >> "$GITHUB_OUTPUT"
          popd >/dev/null
          popd >/dev/null

      - name: Smoke test the bundled binary
        run: |
          "${{ steps.bundle.outputs.bundle_path }}/Contents/MacOS/mpv" -v --no-config

      - name: Package release assets and metadata
        id: package
        env:
          BUNDLE_PATH: ${{ steps.bundle.outputs.bundle_path }}
          ARCHIVE_PATH: ${{ runner.temp }}/mpv-macos-arm64.zip
          CHECKSUMS_PATH: ${{ runner.temp }}/SHA256SUMS.txt
          METADATA_PATH: ${{ runner.temp }}/build-metadata.json
          MPV_SHA: ${{ needs.check-upstream.outputs.mpv_sha }}
          MPV_BUILD_SHA: ${{ needs.check-upstream.outputs.mpv_build_sha }}
          FFMPEG_SHA: ${{ needs.check-upstream.outputs.ffmpeg_sha }}
          LIBASS_SHA: ${{ needs.check-upstream.outputs.libass_sha }}
          LIBPLACEBO_SHA: ${{ needs.check-upstream.outputs.libplacebo_sha }}
          LIBDOVI_SHA: ${{ steps.libdovi.outputs.libdovi_sha }}
          CARGO_C_SHA: ${{ needs.check-upstream.outputs.cargo_c_sha }}
        run: bash scripts/create_checksums.sh

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_MPV_SHA: ${{ needs.check-upstream.outputs.previous_mpv_sha }}
          PREVIOUS_MPV_BUILD_SHA: ${{ needs.check-upstream.outputs.previous_mpv_build_sha }}
          PREVIOUS_FFMPEG_SHA: ${{ needs.check-upstream.outputs.previous_ffmpeg_sha }}
          PREVIOUS_LIBASS_SHA: ${{ needs.check-upstream.outputs.previous_libass_sha }}
          PREVIOUS_LIBPLACEBO_SHA: ${{ needs.check-upstream.outputs.previous_libplacebo_sha }}
          PREVIOUS_LIBDOVI_SHA: ${{ needs.check-upstream.outputs.previous_libdovi_sha }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          CUSTOM_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          python3 scripts/release_notes.py \
            --metadata "${{ steps.package.outputs.metadata_path }}" \
            --output "$RUNNER_TEMP/release-notes.md" \
            --title "$RELEASE_TITLE" \
            --previous-mpv "$PREVIOUS_MPV_SHA" \
            --previous-mpv-build "$PREVIOUS_MPV_BUILD_SHA" \
            --previous-ffmpeg "$PREVIOUS_FFMPEG_SHA" \
            --previous-libass "$PREVIOUS_LIBASS_SHA" \
            --previous-libplacebo "$PREVIOUS_LIBPLACEBO_SHA" \
            --previous-libdovi "$PREVIOUS_LIBDOVI_SHA" \
            --custom-notes "$CUSTOM_RELEASE_NOTES"

      - name: Create or update GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ steps.release.outputs.kind }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_DRAFT: ${{ steps.release.outputs.draft }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          CHECKSUMS_PATH: ${{ steps.package.outputs.checksums_path }}
          METADATA_PATH: ${{ steps.package.outputs.metadata_path }}
        run: |
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"

          # Upload one asset at a time, each with its own retry. gh's internal retry
          # re-streams a body whose upload already committed server-side and then dies
          # on 422 "ReleaseAsset.name already exists" (cli/cli#7178), killing every
          # other asset in the batch. A fresh --clobber invocation per attempt deletes
          # the ghost asset left by the previous attempt and re-uploads cleanly.
          upload_asset() {
            local asset="$1"
            local attempt delay
            for attempt in 1 2 3; do
              echo "Uploading $(basename "$asset") (attempt $attempt/3)..."
              if gh release upload "$RELEASE_TAG" "$asset" --clobber; then
                return 0
              fi
              if [[ $attempt -lt 3 ]]; then
                case $attempt in
                  1) delay=5 ;;
                  2) delay=15 ;;
                esac
                echo "Upload of $(basename "$asset") failed; retrying in ${delay}s..." >&2
                sleep "$delay"
              fi
            done
            echo "Failed to upload $(basename "$asset") after 3 attempts." >&2
            return 1
          }

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$RELEASE_KIND" == release ]]; then
              echo "Versioned release $RELEASE_TAG already exists." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            args=(--title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md")
            [[ "$RELEASE_DRAFT" == true ]] && args+=(--draft)
            [[ "$RELEASE_PRERELEASE" == true ]] && args+=(--prerelease)
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" "${args[@]}"
          fi

          for asset in "$ARCHIVE_PATH" "$CHECKSUMS_PATH" "$METADATA_PATH"; do
            upload_asset "$asset"
          done

          # Confirm the published set actually landed complete: gh can exit 0 while an
          # asset is still in "starter" state server-side, which would silently ship a
          # broken archive. A listing that cannot be read is logged and skipped rather
          # than adding a new failure mode to the release.
          incomplete_assets="$RUNNER_TEMP/incomplete-assets.txt"
          if gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[] | select(.state != "uploaded") | .name' > "$incomplete_assets"; then
            if [[ -s "$incomplete_assets" ]]; then
              echo "Incomplete assets detected:" >&2
              cat "$incomplete_assets" >&2
              exit 1
            fi
          else
            echo "WARNING: could not list release assets; skipping completeness check." >&2
          fi

          if [[ "$RELEASE_KIND" == nightly ]]; then
            git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$RELEASE_TAG"
          fi
          printf 'release_url=%s\n' "$release_url" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew cask
        id: tap
        if: ${{ steps.release.outputs.update_cask == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CASK_CHANNEL: ${{ steps.release.outputs.kind }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          MPV_SHA: ${{ needs.check-upstream.outputs.mpv_sha }}
          MPV_BUILD_SHA: ${{ needs.check-upstream.outputs.mpv_build_sha }}
        run: |
          python3 scripts/update_formula.py \
            --release-tag "$RELEASE_TAG" \
            --cask "$CASK_CHANNEL" \
            --sha256 "$SHA256" \
            --mpv-sha "$MPV_SHA" \
            --mpv-build-sha "$MPV_BUILD_SHA" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mpv-${{ steps.release.outputs.tag }}-macos-arm64
          path: |
            ${{ steps.bundle.outputs.bundle_path }}
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksums_path }}
            ${{ steps.package.outputs.metadata_path }}
          retention-days: 30

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mpv-build-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mpv-build/**/*.log
            ${{ runner.temp }}/mpv-build/**/meson-logs/**
          if-no-files-found: warn
          retention-days: 30

      - name: Write workflow summary
        if: always()
        env:
          CHANGED: ${{ needs.check-upstream.outputs.should_build }}
          DURATION: ${{ steps.package.outputs.duration_seconds }}
          ARTIFACT_SIZE: ${{ steps.package.outputs.artifact_size_bytes }}
          MPV_VERSION: ${{ steps.package.outputs.mpv_version }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
          TAP_PR_URL: ${{ steps.tap.outputs.tap_pr_url }}
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          {
            echo '## mpv build summary'
            echo
            [[ -n "${MPV_VERSION:-}" ]] && echo "- mpv version: \`$MPV_VERSION\`" || true
            echo "- Changed: ${CHANGED:-unknown}"
            echo "- Built: $([[ -n "${DURATION:-}" ]] && echo yes || echo no)"
            echo '- Skipped: no'
            echo "- Status: $WORKFLOW_STATUS"
            [[ -n "${DURATION:-}" ]] && echo "- Duration: ${DURATION} seconds" || true
            [[ -n "${ARTIFACT_SIZE:-}" ]] && echo "- Artifact size: ${ARTIFACT_SIZE} bytes" || true
            [[ -n "${RELEASE_URL:-}" ]] && echo "- Release: $RELEASE_URL" || true
            [[ -n "${TAP_PR_URL:-}" ]] && echo "- Homebrew PR: $TAP_PR_URL" || true
          } >> "$GITHUB_STEP_SUMMARY"

  summary-for-skipped-nightly:
    needs: check-upstream
    if: ${{ github.event_name == 'schedule' && needs.check-upstream.outputs.should_build != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write workflow summary
        run: |
          {
            echo '## mpv nightly summary'
            echo
            echo '- Changed: no'
            echo '- Built: no'
            echo '- Skipped: yes — mpv and mpv-build revisions match the rolling nightly release.'
          } >> "$GITHUB_STEP_SUMMARY"
